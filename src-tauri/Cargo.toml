[package]
name = "luno-desktop"
version = "0.1.0"
description = "Luno desktop application"
authors = ["Luno"]
edition = "2021"

[lib]
name = "luno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2.7.0", features = [] }
libc = "0.2"
crc32fast = "1"
unicode-normalization = "0.1"
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "flac", "wav"] }
