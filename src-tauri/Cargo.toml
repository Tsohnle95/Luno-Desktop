[package]
name = "luno-desktop"
version = "0.1.0"
description = "Luno desktop application"
authors = ["Luno"]
edition = "2021"

[lib]
name = "luno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2.7.0", features = ["protocol-asset"] }
libc = "0.2"
crc32fast = "1"
unicode-normalization = "0.1"
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
cpal = "0.15"
id3 = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "aac", "flac", "wav", "pcm"] }
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSObject", "NSString"] }
objc2-media-player = { version = "0.2", features = ["block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
