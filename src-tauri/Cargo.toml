[package]
name = "luno-desktop"
version = "0.1.0"
description = "Luno desktop application"
authors = ["Luno"]
edition = "2021"

[lib]
name = "luno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.7.0", features = [] }
