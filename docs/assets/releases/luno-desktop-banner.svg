<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title description">
  <title id="title">Luno Desktop — Your music. Your library.</title>
  <desc id="description">Luno for macOS. Local listening, playlists, and music discovery.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#19151b"/><stop offset="1" stop-color="#0e0e14"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#ffa18b"/><stop offset="1" stop-color="#fa8d76"/></linearGradient>
    <clipPath id="bounds"><rect width="1600" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1600" height="400" fill="url(#background)"/>
    <circle cx="1590" cy="255" r="330" fill="#fa8d76" opacity=".07"/>
    <g fill="none" stroke="#fa8d76" stroke-width="2" opacity=".12">
      <circle cx="1590" cy="255" r="290"/><circle cx="1590" cy="255" r="255"/>
      <circle cx="1590" cy="255" r="220"/><circle cx="1590" cy="255" r="185"/><circle cx="1590" cy="255" r="150"/>
    </g>
    <rect x="62" y="100" width="200" height="200" rx="45" fill="#111114" stroke="#2d2527" stroke-width="2"/>
    <g fill="url(#accent)">
      <rect x="86" y="124" width="152" height="152" rx="27" fill="none" stroke="#fa8d76" stroke-width="10"/>
      <rect x="106" y="176" width="25" height="72" rx="12.5"/>
      <rect x="150" y="149" width="25" height="99" rx="12.5"/>
      <rect x="194" y="194" width="25" height="54" rx="12.5"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="310" y="97" fill="#fa9b86" font-size="20" font-weight="700">LUNO FOR macOS</text>
      <text x="304" y="205" fill="#faf7fc" font-size="88" font-weight="700" letter-spacing="-2">Luno Desktop</text>
      <text x="310" y="282" fill="#c5bdc9" font-size="32" font-weight="500">Your music. Your library.</text>
      <text x="310" y="337" fill="#a097aa" font-size="22">Local listening  /  Playlists  /  Music discovery</text>
    </g>
  </g>
</svg>
