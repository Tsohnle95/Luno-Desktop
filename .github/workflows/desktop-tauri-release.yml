name: Desktop Tauri release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Require reviewed managed binaries
        run: |
          test -d release-input/bin
          for name in ffmpeg ffprobe yt-dlp; do
            test -x "release-input/bin/$name"
          done
      - name: Provision managed binaries
        env:
          LUNO_BINARY_SOURCE_DIR: release-input/bin
        run: ./scripts/provision-desktop-binaries.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build signed DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "signing identity is required"; exit 1; }
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          npm run tauri -- build --bundles dmg
      - name: Verify bundle
        run: ./scripts/verify-desktop-bundle.sh src-tauri/target/release/bundle/macos/Luno.app
      - name: Publish DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
