name: Desktop Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Desktop dependencies include PyObjC, so verify on the supported macOS
    # environment rather than attempting to install them on Linux.
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run desktop tests
        run: python -m pytest
